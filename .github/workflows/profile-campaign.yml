name: Compile every public device profile without personal data
on:
  workflow_dispatch:
  schedule:
    - cron: '31 19 * * 6'
  push:
    branches: [main]
    paths: ['configs/profile-campaign-trigger.txt']
permissions:
  contents: read
concurrency:
  group: profile-campaign-${{ github.repository }}
  cancel-in-progress: false
jobs:
  detect:
    if: '!github.event.repository.private'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: detect
        run: python -m scripts.profile_campaign detect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: profile-candidate
          path: |
            work/profile-campaign/candidate.json
            work/profile-campaign/batches.json
          retention-days: 7
  compile:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      REPOSITORY_PRIVATE: 'true'
      ENFORCE_APPROVED_UPSTREAM: 'true'
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: profile-candidate
          path: work/profile-campaign
      - name: Install synthetic image compilation tools without credentials
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev libssl-dev zlib1g-dev gawk gettext unzip zip file rsync wget curl zstd openssl 7zip android-sdk-libsparse-utils
      - run: python -m scripts.profile_campaign run --batch "$BATCH"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: profile-reports-${{ matrix.batch }}
          path: work/profile-campaign/reports/*.json
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: profile-diagnostics-${{ matrix.batch }}
          path: work/profile-campaign/logs/*.log
          retention-days: 3
  publish:
    needs: [detect, compile]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: profile-candidate
          path: work/profile-campaign
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: profile-reports-*
          path: work/profile-campaign/reports
          merge-multiple: true
      - name: Publish validated metadata only, never firmware
        run: python -m scripts.profile_campaign publish
        env:
          GH_TOKEN: ${{ github.token }}
