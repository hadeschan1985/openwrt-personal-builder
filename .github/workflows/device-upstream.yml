name: Automatically approve tested device updates
on:
  schedule:
    # 05:07 Asia/Singapore; unchanged platforms reuse matching prior evidence.
    - cron: '7 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['configs/device-upstream-trigger.txt']
permissions:
  contents: read
concurrency:
  group: device-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  detect:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      has_cases: ${{ steps.detect.outputs.has_cases }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: detect
        name: Detect complete device catalog and changed platform fingerprints
        run: python -m scripts.device_upstream detect
      - if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-upstream-candidate
          path: work/device-upstream/candidate.json
          if-no-files-found: error
          retention-days: 3
  validate:
    needs: detect
    if: needs.detect.outputs.changed == 'true' && needs.detect.outputs.has_cases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      REPOSITORY_PRIVATE: 'true'
      ENFORCE_APPROVED_UPSTREAM: 'true'
      CONFIG_PATH: configs/device-upstream-qa.json
      CONFIG_JSON: ''
      QA_TARGET: ${{ matrix.target }}
      QA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: device-upstream-candidate
          path: work/device-upstream
      - name: Install ImageBuilder tools without user secrets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev libssl-dev zlib1g-dev gawk gettext unzip zip file rsync wget curl zstd openssl 7zip android-sdk-libsparse-utils
      - name: Prepare candidate platform with temporary root password
        run: python -m scripts.device_upstream prepare --target "$QA_TARGET" --profile "$QA_PROFILE"
      - name: Restore exact author source in a separate transfer step
        run: python -m scripts.source_cache prepare --config "$CONFIG_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compile actual firmware and verify package manifests
        run: python -m scripts.build --config "$CONFIG_PATH"
      - name: Validate actual image integrity
        run: python -m scripts.image_verify
      - name: Recheck upstream and attest this platform only
        run: python -m scripts.device_upstream attest --target "$QA_TARGET" --profile "$QA_PROFILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-passed-${{ strategy.job-index }}
          path: work/device-upstream/reports/*.json
          if-no-files-found: error
          retention-days: 3
      - name: Keep failure diagnostics without publishing test firmware
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-failed-${{ strategy.job-index }}
          path: |
            outputs/build.log
            outputs/build-summary.json
            outputs/image-report.json
          retention-days: 3
  approve:
    needs: [detect, validate]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.changed == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: device-upstream-candidate
          path: work/device-upstream
      - if: needs.detect.outputs.has_cases == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: device-passed-*
          path: work/device-upstream/reports
          merge-multiple: true
      - name: Publish data only and preserve all existing private records
        run: python -m scripts.device_upstream publish
        env:
          GH_TOKEN: ${{ github.token }}
