name: Verify real device and software combinations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['configs/device-combinations-trigger.txt']
permissions:
  contents: read
concurrency:
  group: device-combinations-${{ github.repository }}
  cancel-in-progress: false
jobs:
  matrix:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: matrix
        run: python -m scripts.device_combinations matrix
  verify:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.matrix.outputs.cases) }}
    env:
      REPOSITORY_PRIVATE: 'true'
      ENFORCE_APPROVED_UPSTREAM: 'true'
      CONFIG_PATH: configs/device-combination-qa.json
      QA_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build tools without user secrets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev libssl-dev zlib1g-dev gawk gettext unzip zip file rsync wget curl zstd openssl 7zip
      - name: Prepare exact approved model and software
        run: python -m scripts.device_combinations prepare --case "$QA_CASE"
      - name: Build actual firmware and verify package manifests
        run: python -m scripts.build --config "$CONFIG_PATH"
      - name: Verify actual firmware files
        run: python -m scripts.image_verify
      - name: Recheck upstream and record this combination
        run: python -m scripts.device_combinations attest
      - name: Keep diagnostic reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: combination-${{ matrix.case }}
          path: |
            outputs/build.log
            outputs/build-summary.json
            outputs/image-report.json
            outputs/combination-summary.json
            outputs/combination-proof.json
          retention-days: 3
