name: Build personal firmware
run-name: Personal firmware · ${{ inputs.request_id || github.run_number }}

on:
  push:
    branches: [main]
    paths: ['configs/delivery-qa.json']
  workflow_dispatch:
    inputs:
      config_json:
        description: Paste the JSON exported from the web form (leave empty to use config_path)
        type: string
        required: false
      config_path:
        description: Config file under configs/
        type: string
        default: configs/x86-default.json
      request_id:
        description: Optional identifier generated by the configuration page
        type: string
        required: false
      rebuild_run_id:
        description: Optional original run ID for an archived-input offline rebuild
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  firmware:
    if: github.event_name != 'push' || github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CONFIG_JSON: ${{ inputs.config_json }}
      CONFIG_PATH: ${{ inputs.rebuild_run_id && 'configs/rebuild-original.json' || github.event_name == 'push' && 'configs/delivery-qa.json' || inputs.config_path }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      ENFORCE_APPROVED_UPSTREAM: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore original input snapshot in a separate transfer process
        if: inputs.rebuild_run_id != ''
        run: python -m scripts.rebuild restore --run "$REBUILD_RUN_ID"
        env:
          REBUILD_RUN_ID: ${{ inputs.rebuild_run_id }}
          GH_TOKEN: ${{ github.token }}
      - name: Validate configuration
        id: config
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.build import normalize, package_plan, has_private_content, require
          raw = os.environ.get('CONFIG_JSON', '').strip()
          if not raw:
              path = Path(os.environ.get('CONFIG_PATH') or 'configs/x86-default.json').resolve()
              require(path.is_relative_to(Path('configs').resolve()), 'Config must be under configs/')
              raw = path.read_text(encoding='utf-8')
          require(len(raw.encode()) <= 60000, 'Config exceeds 60 KB')
          config = normalize(json.loads(raw))
          package_plan(config)
          require(os.environ['REPOSITORY_PRIVATE'] == 'true' or not has_private_content(config),
                  'Use a private repository for secrets, overlays or custom shell')
          # Do not print configuration or user shell to the log.
          print('Configuration validated:', config['version'], config['target'], config['profile'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('builder_key=' + config['version'] + '-' + config['target'].replace('/', '-') + '\n')
              output.write('build_mode=' + config['build_mode'] + '\n')
              output.write('x86=' + str(config['target'].startswith('x86/')).lower() + '\n')
              output.write('box=' + str(bool(config.get('box'))).lower() + '\n')
              output.write('router_secret=' + str(config['system']['password_secret'] and config['system'].get('password_source')!='root').lower() + '\n')
              output.write('pppoe_secret=' + str(config['network']['pppoe_secret']).lower() + '\n')
              output.write('wifi_secret=' + str(config['network']['wifi_password_secret']).lower() + '\n')
          PY
      - name: Validate selected private settings
        run: python -c "import os; from scripts.delivery import config,policy; policy(config(),os.environ)"
        env:
          ROUTER_PASSWORD: ${{ steps.config.outputs.router_secret == 'true' && secrets.ROUTER_PASSWORD || '' }}
      - name: Install ImageBuilder dependencies
        timeout-minutes: 20
        run: |
          packages=(build-essential libncurses-dev libssl-dev zlib1g-dev gawk gettext unzip zip file rsync wget curl zstd 7zip openssl android-sdk-libsparse-utils e2fsprogs iproute2)
          if [ "$BUILD_X86" = true ]; then packages+=(qemu-utils); fi
          if [ "$BUILD_MODE" = release ]; then packages+=(qemu-system-x86 ovmf openssh-client sshpass smbclient); fi
          if [ "$BUILD_BOX" = true ]; then packages+=(btrfs-progs dosfstools parted u-boot-tools uuid-runtime pigz kmod); fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends "${packages[@]}"
        env:
          BUILD_X86: ${{ steps.config.outputs.x86 }}
          BUILD_MODE: ${{ steps.config.outputs.build_mode }}
          BUILD_BOX: ${{ steps.config.outputs.box }}
      - name: Restore verified ImageBuilder download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/downloads
          key: imagebuilder-v1-${{ runner.os }}-${{ steps.config.outputs.builder_key }}
          restore-keys: |
            imagebuilder-v1-${{ runner.os }}-
      - name: Restore separately verified private source when needed
        if: inputs.rebuild_run_id == ''
        run: python -m scripts.source_cache prepare --config "${CONFIG_PATH:-configs/x86-default.json}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build firmware
        run: |
          if [ -n "$REBUILD_RUN_ID" ]; then
            sudo -E unshare --net -- bash -euc '
              ip link set dev lo up
              python -m scripts.offline_namespace
              exec setpriv --reuid "$1" --regid "$2" --init-groups python -m scripts.build --config "$3"
            ' offline-build "$(id -u)" "$(id -g)" "$CONFIG_PATH"
            cp work/offline-network-report.json outputs/offline-network-report.json
          else
            python -m scripts.build --config "${CONFIG_PATH:-configs/x86-default.json}"
          fi
        env:
          REBUILD_RUN_ID: ${{ inputs.rebuild_run_id }}
          ROUTER_PASSWORD: ${{ steps.config.outputs.router_secret == 'true' && secrets.ROUTER_PASSWORD || '' }}
          PPPOE_USERNAME: ${{ steps.config.outputs.pppoe_secret == 'true' && secrets.PPPOE_USERNAME || '' }}
          PPPOE_PASSWORD: ${{ steps.config.outputs.pppoe_secret == 'true' && secrets.PPPOE_PASSWORD || '' }}
          WIFI_PASSWORD: ${{ steps.config.outputs.wifi_secret == 'true' && secrets.WIFI_PASSWORD || '' }}
      - name: Inventory public input cache for reproducible rebuild support
        run: python -m scripts.input_probe
      - name: Verify actual images and selected local services
        if: steps.config.outputs.build_mode == 'release'
        run: python -m scripts.delivery_vm
        env:
          ROUTER_PASSWORD: ${{ steps.config.outputs.router_secret == 'true' && secrets.ROUTER_PASSWORD || '' }}
          PPPOE_USERNAME: ${{ steps.config.outputs.pppoe_secret == 'true' && secrets.PPPOE_USERNAME || '' }}
          PPPOE_PASSWORD: ${{ steps.config.outputs.pppoe_secret == 'true' && secrets.PPPOE_PASSWORD || '' }}
          WIFI_PASSWORD: ${{ steps.config.outputs.wifi_secret == 'true' && secrets.WIFI_PASSWORD || '' }}
      - name: Verify device firmware containers and file integrity
        if: steps.config.outputs.build_mode == 'device'
        run: python -m scripts.image_verify
      - name: Capture exact builders packages and fixed sources without generated private files
        if: github.event.repository.private
        run: python -m scripts.rebuild stage
      - name: Prepare delivery manifest
        id: delivery
        run: python -m scripts.delivery record
      - name: Transfer private rebuild inputs to a fresh publication job
        if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rebuild-inputs-${{ github.run_id }}
          path: work/rebuild-upload/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload EFI disk
        if: steps.delivery.outputs.efi == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-efi
          path: work/downloads-separated/efi/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload Legacy disk
        if: steps.delivery.outputs.legacy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-legacy
          path: work/downloads-separated/legacy/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload EFI VMDK disk
        if: contains(fromJSON(steps.delivery.outputs.download_groups), 'efi-vmdk')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-efi-vmdk
          path: work/downloads-separated/efi-vmdk/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload Legacy VMDK disk
        if: contains(fromJSON(steps.delivery.outputs.download_groups), 'legacy-vmdk')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-legacy-vmdk
          path: work/downloads-separated/legacy-vmdk/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload ROOTFS
        if: steps.delivery.outputs.rootfs == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-rootfs
          path: work/downloads-separated/rootfs/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload each device image separately
        if: fromJSON(steps.delivery.outputs.device_count) > 0
        uses: ./.github/actions/upload-device-images
        with:
          run_number: ${{ github.run_number }}
          count: ${{ steps.delivery.outputs.device_count }}
      - name: Upload logs and manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-reports
          path: |
            outputs/*.log
            outputs/SHA256SUMS
            outputs/*.manifest
            outputs/*.json
          retention-days: 7
      - name: Upload private record for trusted recorder
        if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-record-${{ github.run_id }}
          path: work/build-record.json
          retention-days: 7
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-build-log-${{ github.run_number }}
          path: outputs/build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Run summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('outputs/build-summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Firmware built\n\n')
              f.write('Each x86 download contains one image only: EFI, Legacy, EFI VMDK and Legacy VMDK are separate. Download only the format you need. Verify SHA256SUMS before use.\n\n')
              mode = '${{ steps.config.outputs.build_mode }}'
              status={'release':'exact-image VM verified; hardware NOT tested','device':'device firmware built and integrity checked; NOT boot/hardware tested','experiment':'EXPERIMENTAL; NOT boot/hardware tested'}
              f.write('Status: **'+status[mode]+'**.\n\n')
              f.write('| File | Bytes | SHA256 |\n|---|---:|---|\n')
              for item in data['files']:
                  f.write(f"| {item['name']} | {item['bytes']} | `{item['sha256']}` |\n")
          PY
  record:
    needs: firmware
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: build-record-${{ github.run_id }}
          path: work
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: rebuild-inputs-${{ github.run_id }}
          path: work/rebuild-upload
      - name: Verify and retain private input snapshots without executing archived sources
        run: python -m scripts.rebuild publish
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save private build record without executing upstream code
        run: python -m scripts.delivery save
        env:
          GH_TOKEN: ${{ github.token }}
