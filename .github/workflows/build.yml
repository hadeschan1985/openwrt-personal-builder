name: Build personal firmware
run-name: Personal firmware · ${{ inputs.request_id || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      config_json:
        description: Paste the JSON exported from the web form (leave empty to use config_path)
        type: string
        required: false
      config_path:
        description: Config file under configs/
        type: string
        default: configs/x86-default.json
      request_id:
        description: Optional identifier generated by the configuration page
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.repository }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CONFIG_JSON: ${{ inputs.config_json }}
      CONFIG_PATH: ${{ inputs.config_path }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      ENFORCE_APPROVED_UPSTREAM: 'true'
      ROUTER_PASSWORD: ${{ secrets.ROUTER_PASSWORD }}
      PPPOE_USERNAME: ${{ secrets.PPPOE_USERNAME }}
      PPPOE_PASSWORD: ${{ secrets.PPPOE_PASSWORD }}
      WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate configuration
        id: config
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.build import normalize, package_plan, has_private_content, require
          raw = os.environ.get('CONFIG_JSON', '').strip()
          if not raw:
              path = Path(os.environ.get('CONFIG_PATH') or 'configs/x86-default.json').resolve()
              require(path.is_relative_to(Path('configs').resolve()), 'Config must be under configs/')
              raw = path.read_text(encoding='utf-8')
          require(len(raw.encode()) <= 60000, 'Config exceeds 60 KB')
          config = normalize(json.loads(raw))
          package_plan(config)
          require(os.environ['REPOSITORY_PRIVATE'] == 'true' or not has_private_content(config),
                  'Use a private repository for secrets, overlays or custom shell')
          # Do not print configuration or user shell to the log.
          print('Configuration validated:', config['version'], config['target'], config['profile'])
          from scripts.delivery import policy
          policy(config, os.environ)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('builder_key=' + config['version'] + '-' + config['target'].replace('/', '-') + '\n')
              output.write('build_mode=' + config['build_mode'] + '\n')
          PY
      - name: Install ImageBuilder dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev libssl-dev \
            zlib1g-dev gawk gettext unzip zip file rsync wget curl zstd qemu-utils qemu-system-x86 ovmf openssh-client sshpass smbclient 7zip openssl
      - name: Restore verified ImageBuilder download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/downloads
          key: imagebuilder-v1-${{ runner.os }}-${{ steps.config.outputs.builder_key }}
          restore-keys: |
            imagebuilder-v1-${{ runner.os }}-
      - name: Build firmware
        run: python -m scripts.build --config "${CONFIG_PATH:-configs/x86-default.json}"
      - name: Verify actual images and selected local services
        if: steps.config.outputs.build_mode == 'release'
        run: python -m scripts.delivery_vm
      - name: Prepare delivery manifest
        id: delivery
        run: python -m scripts.delivery record
      - name: Upload EFI disk
        if: steps.delivery.outputs.efi == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-efi
          path: outputs/*combined-efi.img.gz
          retention-days: 7
          compression-level: 0
      - name: Upload Legacy disk
        if: steps.delivery.outputs.legacy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-legacy
          path: outputs/*combined.img.gz
          retention-days: 7
          compression-level: 0
      - name: Upload VMDK disks
        if: steps.delivery.outputs.vmdk == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-vmdk
          path: outputs/*.vmdk*
          retention-days: 7
          compression-level: 0
      - name: Upload ROOTFS
        if: steps.delivery.outputs.rootfs == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-rootfs
          path: outputs/*rootfs.tar.gz
          retention-days: 7
          compression-level: 0
      - name: Upload other-platform firmware
        if: steps.delivery.outputs.x86 != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ github.run_number }}
          path: outputs/
          if-no-files-found: error
          retention-days: 7
      - name: Upload logs and manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ github.run_number }}-reports
          path: |
            outputs/build.log
            outputs/SHA256SUMS
            outputs/*.manifest
            outputs/build-summary.json
            outputs/vm-report.json
          retention-days: 7
      - name: Upload private record for trusted recorder
        if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-record-${{ github.run_id }}
          path: work/build-record.json
          retention-days: 7
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-build-log-${{ github.run_number }}
          path: outputs/build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Run summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('outputs/build-summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Firmware built\n\n')
              f.write('Download the firmware artifact below. Verify SHA256SUMS before use.\n\n')
              mode = '${{ steps.config.outputs.build_mode }}'
              f.write('Status: **exact-image VM verified; hardware NOT tested**.\n\n' if mode == 'release' else 'Status: **EXPERIMENTAL; NOT boot/hardware tested**.\n\n')
              f.write('| File | Bytes | SHA256 |\n|---|---:|---|\n')
              for item in data['files']:
                  f.write(f"| {item['name']} | {item['bytes']} | `{item['sha256']}` |\n")
          PY
  record:
    needs: firmware
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: build-record-${{ github.run_id }}
          path: work
      - name: Save private build record without executing upstream code
        run: python -m scripts.delivery save
        env:
          GH_TOKEN: ${{ github.token }}
