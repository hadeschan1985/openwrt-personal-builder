name: Verify exact official alternatives for Rockchip devices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['configs/public-official-devices-trigger.txt']
permissions:
  contents: read
concurrency:
  group: public-official-devices-${{ github.repository }}
  cancel-in-progress: false
jobs:
  matrix:
    if: '!github.event.repository.private'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: matrix
        run: python -m qa.public_official_devices matrix
  verify:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: ${{ fromJSON(needs.matrix.outputs.profiles) }}
    env:
      REPOSITORY_PRIVATE: 'true'
      CONFIG_PATH: configs/public-official-device-qa.json
      CONFIG_JSON: ''
      QA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install bounded synthetic image tools without account credentials
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends build-essential libncurses-dev libssl-dev zlib1g-dev gawk gettext unzip zip file rsync wget curl zstd openssl 7zip
      - name: Prepare exact official model and advertised output format
        run: python -m qa.public_official_devices prepare --profile "$QA_PROFILE"
      - name: Compile actual official device image and verify installed packages
        run: python -m scripts.build --config "$CONFIG_PATH"
      - name: Verify complete image and stable source metadata
        run: |
          python -m scripts.image_verify
          python -m qa.public_official_devices verify --profile "$QA_PROFILE"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-official-${{ matrix.profile }}-reports-only
          path: |
            work/public-official-device-report.json
            outputs/build.log
            outputs/image-report.json
          retention-days: 7
