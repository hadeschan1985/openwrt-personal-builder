name: Verify restored OneCloud firmware build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['configs/onecloud-build-trigger.txt']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REPOSITORY_PRIVATE: 'true'
      ENFORCE_APPROVED_UPSTREAM: 'true'
      CONFIG_PATH: configs/device-upstream-qa.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Discover current public metadata and prepare restored platform
        run: |
          python -m scripts.device_upstream detect
          python -m scripts.device_upstream prepare --target amlogic/meson8b --profile thunder-onecloud
      - name: Install ImageBuilder tools without user secrets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev libssl-dev zlib1g-dev gawk gettext unzip zip file rsync wget curl zstd openssl 7zip android-sdk-libsparse-utils
      - name: Restore exact author builder
        run: python -m scripts.source_cache prepare --config "$CONFIG_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build actual OneCloud firmware
        run: python -m scripts.build --config "$CONFIG_PATH"
      - name: Verify actual images and report
        run: |
          python -m scripts.image_verify
          python -m scripts.device_upstream attest --target amlogic/meson8b --profile thunder-onecloud
          cat outputs/image-report.json
      - name: Keep reports without publishing test firmware
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: restored-onecloud-build-reports
          path: |
            outputs/build.log
            outputs/build-summary.json
            outputs/image-report.json
            outputs/onecloud-pack-report.json
          retention-days: 3
