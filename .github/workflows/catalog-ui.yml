name: Verify approved catalogs and webpage transitions without building
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['configs/catalog-ui-trigger.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-ui-${{ github.repository }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix work/web-e2e --ignore-scripts --no-audit --no-fund playwright@1.64.1
          work/web-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Read current approvals through the actual page
        run: node qa/catalog-ui.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog-ui-report
          path: |
            work/catalog-ui/report.json
            work/catalog-ui/mobile.png
          retention-days: 3
