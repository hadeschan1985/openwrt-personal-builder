name: Isolated firmware boot regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boot-qa.yml'
      - 'scripts/smoke.py'
      - 'configs/qa-trigger.txt'
permissions:
  contents: read
concurrency:
  group: boot-qa-${{ github.repository }}
  cancel-in-progress: true
jobs:
  boot:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [official, kwrt]
    env:
      REPOSITORY_PRIVATE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install isolated build and VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev libssl-dev \
            zlib1g-dev gawk gettext unzip zip file rsync wget curl zstd qemu-utils qemu-system-x86 ovmf openssh-client 7zip
      - name: Prepare ephemeral QA credentials and overlay
        run: python -m scripts.smoke prepare --source "$QA_SOURCE"
        env:
          QA_SOURCE: ${{ matrix.source }}
      - name: Build disposable QA images
        run: python scripts/build.py --config configs/qa-generated.json
        env:
          CONFIG_JSON: ''
      - name: Boot EFI, Legacy and VMDK; verify LuCI and settings
        run: python -m scripts.smoke run
      - name: Upload reports only (never QA images or keys)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-qa-report-${{ matrix.source }}
          path: |
            work/qa/boot-report.json
            work/qa/serial-*.log
            work/qa/qemu-*.log
            work/qa/guest-*.log
            outputs/build.log
          if-no-files-found: ignore
          retention-days: 7
