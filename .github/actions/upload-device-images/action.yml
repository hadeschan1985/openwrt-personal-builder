name: Upload device images separately
description: One firmware file per artifact, bounded to 32 files
inputs:
  count:
    description: Number of device image files
    required: true
  run_number:
    description: Build number
    required: true
runs:
  using: composite
  steps:
    - if: fromJSON(inputs.count) >= 1
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: firmware-${{ inputs.run_number }}-device-01
        path: work/downloads-separated/device-01/*
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - if: fromJSON(inputs.count) >= 2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
